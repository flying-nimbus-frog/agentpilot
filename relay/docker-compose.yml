services:
  ocrelay:
    build:
      context: .
      args:
        # 国内镜像仓基础镜像（.env 里可覆盖），如 PYTHON_IMAGE=docker.m.daocloud.io/library/python:3.12-slim
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        # 国内 PyPI 镜像（.env 里可覆盖）
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: opencode-relay:latest
    container_name: ocrelay
    restart: always
    ports:
      # 只监听本机回环，由宿主机 nginx/Caddy 反代对外（安全）
      - "127.0.0.1:${RELAY_PORT:-8010}:8000"
    volumes:
      - ocrelay-data:/data
    environment:
      RELAY_JWT_SECRET: ${RELAY_JWT_SECRET:?请在 .env 中设置 RELAY_JWT_SECRET}
      RELAY_DB: /data/relay.db
      # Web/浏览器调试需要 CORS（原生手机 App 不受影响，可设 RELAY_CORS=0 关闭）
      RELAY_CORS: ${RELAY_CORS:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default
      - zhile

networks:
  default:
  zhile:
    external: true
    name: license_server_default

volumes:
  ocrelay-data:
