<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCode Remote · 桌面端</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header>
      <div class="brand">📡 OpenCode Remote</div>
      <div class="status-bar">
        <span id="st-account" class="chip gray">账号 --</span>
        <span id="st-relay" class="chip gray">中继 --</span>
        <span id="st-device" class="chip gray">设备 --</span>
        <span id="st-agent" class="chip gray">Agent --</span>
      </div>
    </header>

    <nav>
      <button id="tab-activity" class="tab active">活动</button>
      <button id="tab-log" class="tab">日志</button>
      <button id="btn-settings" class="tab" style="margin-left:auto">⚙️ 设置</button>
    </nav>

    <!-- ============ 设置（弹窗） ============ -->
    <div id="settings-overlay" class="hidden">
      <div class="ov-panel settings-panel">
        <div class="ov-head">⚙️ 设置 <button id="btn-settings-close">✕</button></div>
        <div class="ov-body settings-body">
          <div id="settings-content"></div>
        </div>
      </div>
    </div>

    <!-- ============ 设备（设置弹窗内） ============ -->
    <section id="pane-device" class="pane">
      <div class="card">
        <h3>账号</h3>
        <div class="row2">
          <div>
            <label>邮箱</label>
            <input id="in-email" placeholder="you@example.com" />
          </div>
          <div>
            <label>密码</label>
            <input id="in-pass" type="password" placeholder="******" />
          </div>
        </div>
        <div class="btns">
          <button id="btn-login" class="primary">登录</button>
          <button id="btn-register">注册</button>
        </div>
        <p id="account-msg" class="msg"></p>
      </div>

      <div class="card">
        <h3>设备绑定</h3>
        <div id="device-status" class="msg">未登录</div>
        <div id="pairing-box" class="pairing hidden">
          <div class="pairing-code" id="pairing-code">------</div>
          <p class="dim">在手机 App 设备列表中输入此配对码完成绑定</p>
        </div>
        <div class="btns">
          <button id="btn-device-register" class="primary" disabled>注册本机为设备</button>
          <button id="btn-device-unbind" class="danger hidden">解绑设备</button>
        </div>
        <p id="device-msg" class="msg"></p>
      </div>
    </section>

    <!-- ============ Agent ============ -->
    <section id="pane-agent" class="pane">
      <div class="card">
        <h3>Agent 引擎</h3>
        <p id="agent-detect" class="msg">检测中…</p>
        <label>引擎类型</label>
        <div class="row2">
          <label class="radio"><input type="radio" name="agent-mode" value="mini" checked /> 内置 MiniAgent（直连模型）</label>
          <label class="radio"><input type="radio" name="agent-mode" value="opencode" /> 嵌入 opencode（完整工具能力）</label>
        </div>

        <div id="cfg-mini">
          <label>API 地址</label>
          <input id="in-api-base" placeholder="https://api.deepseek.com" />
          <label>API Key</label>
          <input id="in-api-key" type="password" placeholder="sk-..." />
          <label>模型</label>
          <input id="in-model" placeholder="deepseek-v4-flash" />
        </div>

        <div id="cfg-opencode" class="hidden">
          <label>工作目录</label>
          <input id="in-agent-dir" placeholder="/Users/you/projects" />
          <label>模型（必填，费用透明）</label>
          <input id="in-opencode-model" placeholder="deepseek/deepseek-v4-flash" />
          <p class="dim">格式 provider/model，不填则使用 opencode 默认模型（可能产生未知费用）</p>
          <label>权限配置（可选，JSON）</label>
          <textarea id="in-permission" rows="2" placeholder='{"bash":"ask"}'></textarea>
        </div>

        <div class="btns">
          <button id="btn-agent-start" class="primary">启动 Agent</button>
          <button id="btn-agent-stop" class="danger">停止 Agent</button>
        </div>
        <p id="agent-msg" class="msg"></p>
      </div>
    </section>

    <!-- ============ 活动 ============ -->
    <section id="pane-activity" class="pane">
      <div class="card log-card">
        <h3>Agent 运行过程（实时）</h3>
        <div id="activity-view" class="activity"></div>
      </div>
    </section>

    <!-- ============ 日志 ============ -->
    <section id="pane-log" class="pane">
      <div class="card log-card">
        <h3>运行日志</h3>
        <pre id="log-view"></pre>
      </div>
    </section>
  </body>
</html>
